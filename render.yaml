# Render Blueprint: New > Blueprint, pick this repo. (Or create a Static Site by hand; see README.)
services:
  - type: web
    runtime: static
    name: post-analytical-tracker
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
